<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../uibuilder/images/uib-world.svg" type="image/svg+xml">

    <title>Modern SPA template - Node-RED UIBUILDER</title>
    <meta name="description" content="Node-RED UIBUILDER - Modern SPA template">

    <!-- Your own CSS -->
    <link type="text/css" rel="stylesheet" href="./index.css" media="all">

    <!-- NOTE this MUST be loaded as a MODULE. Imports uibuilder. Contains your custom code -->
    <script type="module" async src="./index.mjs"></script>
</head><body>
    <header>
        <h1 class="with-subtitle">Modern SPA external template Example</h1>
        <div role="doc-subtitle">Using the UIBUILDER for Node-RED ESM library.</div>
        <div id="automenu1"><!-- Used by the router's auto-menu --></div>
        <!-- Uses internal router variables to show the current route's title and id -->
        <div style="background-color: dimgrey;">
            <h2 class="with-subtitle">Current Route: <uib-var variable="uibrouter_CurrentTitle"></uib-var></h2>
            <div role="doc-subtitle"><uib-var variable="uibrouter_CurrentDescription"></uib-var></div>
        </div>
    </header>

    <main>
        <div id="routecontainer"><!-- router content will appear here --></div>

        <!-- '#more' is used as a parent for dynamic HTML content in examples
         Also, send {topic:"more", payload:"Hello from <b>Node-RED</b>"} to auto-display the payload -->
        <div id="more" uib-topic="more"></div>
    </main>

    <footer uib-topic="footer"><!-- Set dynamically from Node-RED or locally if required --></footer>
</body></html>
